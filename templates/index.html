<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Transcription - YouTube & TikTok</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .radio-group {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .radio-option input[type="radio"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .radio-option label {
            margin: 0;
            cursor: pointer;
            font-weight: normal;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            flex: 1;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .transcript-area {
            margin-top: 30px;
        }

        textarea {
            width: 100%;
            min-height: 300px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Courier New', monospace;
            resize: vertical;
        }

        .status {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-weight: 600;
        }

        .status.info {
            background: #e3f2fd;
            color: #1976d2;
        }

        .status.success {
            background: #e8f5e9;
            color: #388e3c;
        }

        .status.error {
            background: #ffebee;
            color: #d32f2f;
        }

        .status.processing {
            background: #fff3e0;
            color: #f57c00;
        }

        .loader {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎥 Video Transcription</h1>
        <p class="subtitle">YouTube & TikTok</p>

        <div class="form-group">
            <label for="url">URL de la vidéo</label>
            <input type="text" id="url" placeholder="https://www.youtube.com/watch?v=... ou https://www.tiktok.com/...">
        </div>

        <div class="form-group">
            <label>Plateforme</label>
            <div class="radio-group">
                <div class="radio-option">
                    <input type="radio" id="platform-auto" name="platform" value="auto" checked>
                    <label for="platform-auto">Auto</label>
                </div>
                <div class="radio-option">
                    <input type="radio" id="platform-youtube" name="platform" value="youtube">
                    <label for="platform-youtube">YouTube</label>
                </div>
                <div class="radio-option">
                    <input type="radio" id="platform-tiktok" name="platform" value="tiktok">
                    <label for="platform-tiktok">TikTok</label>
                </div>
            </div>
        </div>

        <div class="form-group">
            <label>Langue</label>
            <div class="radio-group">
                <div class="radio-option">
                    <input type="radio" id="lang-fr" name="language" value="fr" checked>
                    <label for="lang-fr">Français</label>
                </div>
                <div class="radio-option">
                    <input type="radio" id="lang-en" name="language" value="en">
                    <label for="lang-en">English</label>
                </div>
                <div class="radio-option">
                    <input type="radio" id="lang-auto" name="language" value="auto">
                    <label for="lang-auto">Auto</label>
                </div>
            </div>
        </div>

        <div class="button-group">
            <button class="btn-primary" id="transcribe-btn" onclick="transcribe()">Transcrire</button>
            <button class="btn-secondary" onclick="copyText()">Copier</button>
            <button class="btn-secondary" onclick="clearText()">Effacer</button>
            <button class="btn-secondary" onclick="downloadText()">Télécharger</button>
        </div>

        <div id="status" class="status hidden"></div>

        <div class="transcript-area">
            <label for="transcript">Transcription</label>
            <textarea id="transcript" placeholder="La transcription apparaîtra ici..."></textarea>
        </div>
    </div>

    <script>
        let pollInterval = null;

        function getSelectedValue(name) {
            return document.querySelector(`input[name="${name}"]:checked`).value;
        }

        function showStatus(message, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
            statusDiv.classList.remove('hidden');
        }

        function hideStatus() {
            document.getElementById('status').classList.add('hidden');
        }

        async function transcribe() {
            const url = document.getElementById('url').value.trim();
            const language = getSelectedValue('language');
            const platform = getSelectedValue('platform');
            const transcriptArea = document.getElementById('transcript');
            const transcribeBtn = document.getElementById('transcribe-btn');

            if (!url) {
                showStatus('Veuillez entrer une URL', 'error');
                return;
            }

            transcribeBtn.disabled = true;
            transcriptArea.value = '';
            showStatus('Transcription en cours...', 'processing');

            try {
                const response = await fetch('/transcribe', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ url, language, platform })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Erreur lors de la transcription');
                }

                if (data.platform === 'youtube') {
                    transcriptArea.value = data.transcript;
                    showStatus('Transcription terminée !', 'success');
                    transcribeBtn.disabled = false;
                } else if (data.platform === 'tiktok') {
                    // Pour TikTok, on poll le statut
                    pollStatus(data.task_id);
                }

            } catch (error) {
                showStatus(`Erreur: ${error.message}`, 'error');
                transcribeBtn.disabled = false;
            }
        }

        async function pollStatus(taskId) {
            const transcriptArea = document.getElementById('transcript');
            const transcribeBtn = document.getElementById('transcribe-btn');

            pollInterval = setInterval(async () => {
                try {
                    const response = await fetch(`/status/${taskId}`);
                    const data = await response.json();

                    if (data.status === 'completed') {
                        clearInterval(pollInterval);
                        transcriptArea.value = data.transcript;
                        showStatus('Transcription terminée !', 'success');
                        transcribeBtn.disabled = false;
                    } else if (data.status === 'error') {
                        clearInterval(pollInterval);
                        showStatus(`Erreur: ${data.error}`, 'error');
                        transcribeBtn.disabled = false;
                    } else {
                        showStatus(`<span class="loader"></span>${data.message}`, 'processing');
                        document.getElementById('status').innerHTML = `<span class="loader"></span>${data.message}`;
                    }
                } catch (error) {
                    clearInterval(pollInterval);
                    showStatus(`Erreur: ${error.message}`, 'error');
                    transcribeBtn.disabled = false;
                }
            }, 2000);
        }

        function copyText() {
            const transcriptArea = document.getElementById('transcript');
            if (!transcriptArea.value) {
                showStatus('Aucun texte à copier', 'info');
                return;
            }
            transcriptArea.select();
            document.execCommand('copy');
            showStatus('Texte copié dans le presse-papier !', 'success');
        }

        function clearText() {
            document.getElementById('transcript').value = '';
            hideStatus();
        }

        function downloadText() {
            const transcriptArea = document.getElementById('transcript');
            if (!transcriptArea.value) {
                showStatus('Aucun texte à télécharger', 'info');
                return;
            }

            const blob = new Blob([transcriptArea.value], { type: 'text/plain' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'transcription.txt';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);
            showStatus('Fichier téléchargé !', 'success');
        }
    </script>
</body>
</html>
